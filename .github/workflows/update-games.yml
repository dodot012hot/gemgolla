name: 게임 데이터 매일 갱신

on:
  schedule:
    - cron: "17 19 * * *" # 매일 한국 시간 새벽 4시 17분
  workflow_dispatch: {} # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 스팀에서 가격·신작 갱신
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 없으면 AI 분류 없이 후보만 기록
        run: node scripts/update-games.mjs
      - name: 바뀐 게 있으면 커밋 (Vercel이 자동 배포)
        run: |
          git config user.name "gemgolla-bot"
          git config user.email "gemgolla-bot@users.noreply.github.com"
          git add public/games.json data/candidates.json
          git diff --cached --quiet || git commit -m "게임 데이터 갱신 $(date -u -d '+9 hours' +%F)"
          git push
